<div class="sheet" id="fsheet" hidden>
  <div class="sheethead"><button class="mini" id="fsBack">← Back</button><b>Filter</b></div>
  <label class="chk" style="margin-top:18px"><input type="checkbox" id="fsPersist"> Persist filter on app restart</label>
  <label for="fsSort">Sort by</label>
  <select id="fsSort"><option value="UPDATED">Last updated</option><option value="TITLE">Title (A to Z)</option><option value="SCORE">My score</option><option value="PROGRESS">Progress</option><option value="AVG">Average score</option><option value="POP">Popularity</option><option value="YEAR">Release year (newest)</option></select>
  <label for="fsFormat">Format</label><select id="fsFormat"></select>
  <label for="fsStatus">Status</label>
  <select id="fsStatus"><option value="">Any</option><option value="FINISHED">Finished</option><option value="RELEASING">Releasing</option><option value="NOT_YET_RELEASED">Not yet released</option><option value="CANCELLED">Cancelled</option><option value="HIATUS">Hiatus</option></select>
  <label for="fsCountry">Country</label>
  <select id="fsCountry"><option value="">Any</option><option value="JP">Japan</option><option value="KR">South Korea</option><option value="CN">China</option><option value="TW">Taiwan</option></select>
  <label>Release year</label>
  <div class="two"><input id="fsYFrom" inputmode="numeric" placeholder="From"><input id="fsYTo" inputmode="numeric" placeholder="To"></div>
  <label id="fsCountLabel">Episodes</label>
  <div class="two"><input id="fsCMin" inputmode="numeric" placeholder="Min"><input id="fsCMax" inputmode="numeric" placeholder="Max"></div>
  <label for="fsScore">Average score (minimum)</label>
  <input id="fsScore" inputmode="numeric" placeholder="0 to 100">
  <label>Genres (tap to include, tap again to exclude)</label>
  <div class="row" id="fsGenres"></div>
  <div class="sheetbar"><button class="go alt" id="fsReset">Reset</button><button class="go" id="fsApply">Apply</button></div>
</div>
