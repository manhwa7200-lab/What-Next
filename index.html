<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14172B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What Next?">
<title>What Next?</title>
<style>
:root{
  --bg:#F5F3FB; --ink:#1B1D3A; --muted:#6A6C8C; --card:#FFFFFF; --line:#DAD7EC;
  --sakura:#E8336D; --sakura-ink:#FFFFFF; --chip:#ECE9F8;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14172B; --ink:#F0EFFA; --muted:#A3A6C8; --card:#1E2240; --line:#32376275; --chip:#262B4D; --sakura:#FF5C8D; --sakura-ink:#1B0A12; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 18px calc(env(safe-area-inset-bottom,0px) + 28px);
}
main{max-width:480px;margin:0 auto}
h1{font-size:2.4rem;line-height:1;margin:4px 0 6px;letter-spacing:-.03em;font-weight:800}
.sub{color:var(--muted);margin:0 0 22px}
label,.q{display:block;font-weight:700;margin:20px 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{
  width:100%;padding:14px 16px;font:inherit;color:var(--ink);background:var(--card);
  border:2px solid var(--line);border-radius:14px;
}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--sakura);outline-offset:2px}
.chip{
  flex:1 1 0;min-width:72px;padding:13px 10px;font:inherit;font-weight:700;color:var(--ink);
  background:var(--chip);border:2px solid transparent;border-radius:14px;cursor:pointer;
}
#genres .chip{flex:0 0 auto;min-width:0;padding:10px 14px}
.chip[aria-pressed="true"]{background:var(--sakura);color:var(--sakura-ink)}
.go{
  width:100%;margin-top:14px;padding:16px;font:inherit;font-weight:800;font-size:1.05rem;
  color:var(--sakura-ink);background:var(--sakura);border:0;border-radius:16px;cursor:pointer;
}
.go.alt{background:var(--chip);color:var(--ink)}
.go:disabled{opacity:.6}
#result{margin-top:26px}
.pick{background:var(--card);border-radius:22px;overflow:hidden;border:2px solid var(--line)}
.pick img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;object-position:top;background:var(--chip)}
.pick .body{padding:16px 18px 18px}
.kind{color:var(--muted);font-size:.9rem;margin:0}
.pick h2{margin:2px 0 10px;font-size:1.5rem;line-height:1.15;letter-spacing:-.01em}
.todo{font-size:1.25rem;font-weight:800;color:var(--sakura);margin:0}
.meta{color:var(--muted);margin:4px 0 0}
a.link{display:inline-block;margin-top:14px;color:var(--ink);font-weight:700}
.msg{padding:14px 16px;border-radius:14px;background:var(--chip)}
.who{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:4px}
.who button{background:none;border:0;color:var(--sakura);font:inherit;font-weight:700;cursor:pointer;padding:6px 0}
.tabs{display:flex;gap:8px;margin:0 0 4px}
select{width:100%;padding:13px 14px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px}
.item{display:flex;gap:12px;margin-top:12px;padding:10px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.item img{width:72px;height:104px;object-fit:cover;border-radius:10px;background:var(--chip);flex:none}
.item h3{margin:0 0 4px;font-size:1.05rem;line-height:1.2}
.item p{margin:0;color:var(--muted);font-size:.9rem}
.item a{display:inline-block;margin-top:6px;font-weight:700;color:var(--sakura)}
.blur img{filter:blur(14px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>What next?</h1>
  <p class="sub">Tell it how much time you have. It picks from your AniList.</p>

  <div class="tabs" id="tabs">
    <button class="chip" data-v="pick" aria-pressed="true">Pick</button>
    <button class="chip" data-v="discover" aria-pressed="false">Discover</button>
    <button class="chip" id="blurBtn" aria-pressed="false">Blur covers</button>
  </div>

  <div id="pickWrap">
  <section id="setup">
    <label for="user">Your AniList username</label>
    <input id="user" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="username">
    <button class="go" id="load">Load my list</button>
  </section>

  <section id="app" hidden>
    <div class="who"><span id="whoName"></span><button id="change">Change user</button></div>

    <div class="q">I want to</div>
    <div class="row" id="kinds">
      <button class="chip" data-v="ANIME" aria-pressed="false">Watch</button>
      <button class="chip" data-v="MANGA" aria-pressed="false">Read</button>
      <button class="chip" data-v="BOTH" aria-pressed="true">Either</button>
    </div>

    <div class="q">I have</div>
    <div class="row" id="times">
      <button class="chip" data-v="15" aria-pressed="false">15 min</button>
      <button class="chip" data-v="30" aria-pressed="true">30 min</button>
      <button class="chip" data-v="60" aria-pressed="false">1 hour</button>
      <button class="chip" data-v="120" aria-pressed="false">2 hours</button>
    </div>

    <div class="q">Genre</div>
    <div class="row" id="genres"></div>

    <div class="q">Content</div>
    <div class="row" id="adult">
      <button class="chip" data-v="ALL" aria-pressed="true">Everything</button>
      <button class="chip" data-v="ONLY" aria-pressed="false">18+ only</button>
      <button class="chip" data-v="HIDE" aria-pressed="false">Hide 18+</button>
    </div>

    <button class="go" id="pickBtn">Pick for me</button>
  </section>

  <div id="result" aria-live="polite"></div>
  </div>

  <section id="discover" hidden>
    <label for="dq">Search</label>
    <input id="dq" autocomplete="off" placeholder="Title (optional)">
    <div class="q">Type</div>
    <div class="row" id="dtype">
      <button class="chip" data-v="ANIME" aria-pressed="true">Anime</button>
      <button class="chip" data-v="MANGA" aria-pressed="false">Manga</button>
    </div>
    <div class="q">Content</div>
    <div class="row" id="dadult">
      <button class="chip" data-v="ALL" aria-pressed="false">Everything</button>
      <button class="chip" data-v="ONLY" aria-pressed="true">18+ only</button>
      <button class="chip" data-v="HIDE" aria-pressed="false">Hide 18+</button>
    </div>
    <label for="dgenre">Genre</label>
    <select id="dgenre"></select>
    <label for="dsort">Sort by</label>
    <select id="dsort">
      <option value="TRENDING_DESC">Trending now</option>
      <option value="POPULARITY_DESC">Most popular</option>
      <option value="SCORE_DESC">Top rated</option>
      <option value="START_DATE_DESC">Newest</option>
    </select>
    <button class="go" id="dgo">Find titles</button>
    <div id="dlist" aria-live="polite"></div>
    <button class="go alt" id="dmore" hidden>Load more</button>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const MIN_PER_CHAPTER = 6; // rough guess for reading speed
const state = { user: "", kind: "BOTH", time: 30, genre: "ALL", adult: "ALL", items: [], skipped: new Set() };

// Build genre chips from the genres that actually appear in the user's list.
function buildGenres(){
  state.genre = "ALL";
  const counts = new Map();
  for(const e of state.items) for(const g of e.media.genres || []) counts.set(g, (counts.get(g) || 0) + 1);
  const names = ["ALL", ...[...counts.entries()].sort((a,b) => b[1] - a[1]).map(x => x[0])];
  const row = $("#genres");
  row.replaceChildren(...names.map(g => {
    const b = document.createElement("button");
    b.className = "chip"; b.dataset.v = g;
    b.setAttribute("aria-pressed", String(g === "ALL"));
    b.textContent = g === "ALL" ? "Any" : g;
    return b;
  }));
}

const QUERY = `
query($u:String){
  anime:MediaListCollection(userName:$u,type:ANIME,status_in:[CURRENT,REPEATING,PLANNING]){lists{entries{status progress media{...M}}}}
  manga:MediaListCollection(userName:$u,type:MANGA,status_in:[CURRENT,REPEATING,PLANNING]){lists{entries{status progress media{...M}}}}
}
fragment M on Media{
  id type siteUrl title{romaji english} coverImage{extraLarge large}
  episodes chapters duration averageScore genres isAdult nextAiringEpisode{episode}
}`;

function msg(text){
  const d = document.createElement("div");
  d.className = "msg"; d.textContent = text;
  $("#result").replaceChildren(d);
}

async function loadList(user){
  $("#load").disabled = true;
  msg("Loading your list…");
  try{
    const res = await fetch("https://graphql.anilist.co", {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({query:QUERY, variables:{u:user}})
    });
    const json = await res.json();
    if(json.errors && !json.data?.anime && !json.data?.manga){
      throw new Error(res.status === 404 ? "User not found. Check the spelling of your username." : "AniList said: " + json.errors[0].message);
    }
    const seen = new Map();
    for(const key of ["anime","manga"]){
      for(const l of json.data[key]?.lists || []){
        for(const e of l.entries){ if(!seen.has(e.media.id)) seen.set(e.media.id, e); }
      }
    }
    state.items = [...seen.values()];
    state.user = user;
    buildGenres();
    localStorage.setItem("wn_user", user);
    $("#whoName").textContent = "Signed in as " + user;
    $("#setup").hidden = true; $("#app").hidden = false;
    if(!state.items.length) return msg("Your lists have nothing in Watching, Reading, or Planning yet.");
    $("#result").replaceChildren();
    pick();
  }catch(err){
    msg(err.message.includes("Failed to fetch") ? "Couldn't reach AniList. Check your connection and try again." : err.message);
  }finally{ $("#load").disabled = false; }
}

// Work out whether an entry fits the time you have, and what to do.
function plan(e){
  const m = e.media, isAnime = m.type === "ANIME";
  const unit = isAnime ? (m.duration || 24) : MIN_PER_CHAPTER;
  let available = isAnime
    ? (m.nextAiringEpisode ? m.nextAiringEpisode.episode - 1 : (m.episodes || Infinity))
    : (m.chapters || Infinity);
  const left = available - e.progress;
  if(left <= 0) return null;
  const n = Math.min(Math.floor(state.time / unit), left, isAnime ? 8 : 30);
  if(n < 1) return null;
  const from = e.progress + 1, to = e.progress + n;
  const range = n === 1 ? String(from) : from + "–" + to;
  return {
    isAnime, n, minutes: Math.round(n * unit),
    action: (isAnime ? "Watch episode " : "Read chapter ") + range,
    progress: e.progress, total: isAnime ? m.episodes : m.chapters
  };
}

function pick(){
  if(!state.items.length) return;
  const cands = [];
  for(const e of state.items){
    if(state.kind !== "BOTH" && e.media.type !== state.kind) continue;
    if(state.genre !== "ALL" && !(e.media.genres || []).includes(state.genre)) continue;
    if(state.adult === "ONLY" && !e.media.isAdult) continue;
    if(state.adult === "HIDE" && e.media.isAdult) continue;
    const p = plan(e);
    if(!p) continue;
    const base = e.status === "PLANNING" ? 50 : e.status === "REPEATING" ? 40 : 100;
    cands.push({e, p, score: base + (e.media.averageScore || 60) / 2 + Math.random() * 30});
  }
  if(!cands.length){
    return msg(state.kind === "ANIME"
      ? "Nothing to watch fits that time. You're caught up, or the episodes are longer than your time."
      : "Nothing matches. Try a different time, genre, or switch to Either.");
  }
  let pool = cands.filter(c => !state.skipped.has(c.e.media.id));
  if(!pool.length){ state.skipped.clear(); pool = cands; }
  pool.sort((a,b) => b.score - a.score);
  show(pool[0]);
}

function show({e,p}){
  const m = e.media, title = m.title.english || m.title.romaji;
  const card = document.createElement("div"); card.className = "pick";
  const img = new Image(); img.alt = ""; img.src = m.coverImage.extraLarge || m.coverImage.large;
  const body = document.createElement("div"); body.className = "body";
  const kind = document.createElement("p"); kind.className = "kind";
  kind.textContent = (p.isAnime ? "Anime" : "Manga") + (e.status === "PLANNING" ? ", on your plan-to list" : "");
  const h = document.createElement("h2"); h.textContent = title;
  const todo = document.createElement("p"); todo.className = "todo"; todo.textContent = p.action;
  const meta = document.createElement("p"); meta.className = "meta";
  meta.textContent = "About " + p.minutes + " min" + (e.status === "PLANNING" ? "" : ". You're at " + p.progress + (p.total ? " of " + p.total : ""));
  const a = document.createElement("a"); a.className = "link"; a.href = m.siteUrl; a.target = "_blank"; a.rel = "noopener"; a.textContent = "Open on AniList";
  body.append(kind, h, todo, meta, a);
  card.append(img, body);
  const again = document.createElement("button"); again.className = "go alt"; again.textContent = "Show me another";
  again.onclick = () => { state.skipped.add(m.id); pick(); };
  $("#result").replaceChildren(card, again);
}

function wireChips(id, key){
  $(id).addEventListener("click", ev => {
    const b = ev.target.closest(".chip"); if(!b) return;
    $(id).querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    state[key] = key === "time" ? Number(b.dataset.v) : b.dataset.v;
    state.skipped.clear(); pick();
  });
}
wireChips("#kinds", "kind"); wireChips("#times", "time"); wireChips("#genres", "genre"); wireChips("#adult", "adult");

$("#load").onclick = () => { const u = $("#user").value.trim(); if(u) loadList(u); };
$("#user").addEventListener("keydown", e => { if(e.key === "Enter") $("#load").click(); });
$("#pickBtn").onclick = () => { state.skipped.clear(); pick(); };
$("#change").onclick = () => {
  $("#app").hidden = true; $("#setup").hidden = false; $("#result").replaceChildren(); $("#user").focus();
};

// ---------- Tabs and cover blur ----------
function showTab(t){
  $("#pickWrap").hidden = t !== "pick";
  $("#discover").hidden = t !== "discover";
  document.querySelectorAll("#tabs .chip[data-v]").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.v === t)));
  if(t === "discover" && !$("#dlist").children.length) discover(false);
}
$("#tabs").addEventListener("click", ev => {
  const b = ev.target.closest(".chip[data-v]"); if(b) showTab(b.dataset.v);
});
function setBlur(on){
  document.body.classList.toggle("blur", on);
  $("#blurBtn").setAttribute("aria-pressed", String(on));
  $("#blurBtn").textContent = on ? "Blur: on" : "Blur covers";
  try{ localStorage.setItem("wn_blur", on ? "1" : "0"); }catch(_){}
}
$("#blurBtn").onclick = () => setBlur(!document.body.classList.contains("blur"));
try{ setBlur(localStorage.getItem("wn_blur") === "1"); }catch(_){}

// ---------- Discover ----------
const GENRES = ["Action","Adventure","Comedy","Drama","Ecchi","Fantasy","Hentai","Horror","Mahou Shoujo","Mecha","Music","Mystery","Psychological","Romance","Sci-Fi","Slice of Life","Sports","Supernatural","Thriller"];
$("#dgenre").replaceChildren(...[["", "Any genre"], ...GENRES.map(g => [g, g])].map(([v, t]) => {
  const o = document.createElement("option"); o.value = v; o.textContent = t; return o;
}));

const dState = { type: "ANIME", adult: "ONLY", page: 1 };
const DQ = `
query($page:Int,$type:MediaType,$sort:[MediaSort],$adult:Boolean,$genre:String,$search:String,$statusNot:MediaStatus){
  Page(page:$page,perPage:20){
    pageInfo{hasNextPage}
    media(type:$type,sort:$sort,isAdult:$adult,genre:$genre,search:$search,status_not:$statusNot){
      id siteUrl title{romaji english} coverImage{large} averageScore format episodes chapters genres seasonYear
    }
  }
}`;

function wireD(id, key){
  $(id).addEventListener("click", ev => {
    const b = ev.target.closest(".chip"); if(!b) return;
    $(id).querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    dState[key] = b.dataset.v;
  });
}
wireD("#dtype", "type"); wireD("#dadult", "adult");

function itemCard(m, onList){
  const card = document.createElement("div"); card.className = "item";
  const img = new Image(); img.alt = ""; img.loading = "lazy"; img.src = m.coverImage.large;
  const info = document.createElement("div");
  const h = document.createElement("h3"); h.textContent = m.title.english || m.title.romaji;
  const size = m.episodes ? m.episodes + " eps" : (m.chapters ? m.chapters + " ch" : "");
  const meta = document.createElement("p");
  meta.textContent = [(m.format || "").replace(/_/g, " "), m.seasonYear, size, m.averageScore ? "★ " + m.averageScore + "%" : ""].filter(Boolean).join(" · ");
  const gen = document.createElement("p"); gen.textContent = (m.genres || []).slice(0, 4).join(", ");
  const a = document.createElement("a"); a.href = m.siteUrl; a.target = "_blank"; a.rel = "noopener";
  a.textContent = onList ? "On your list. Open on AniList" : "Open on AniList";
  info.append(h, meta, gen, a);
  card.append(img, info);
  return card;
}

async function discover(append){
  const list = $("#dlist"), more = $("#dmore"), btn = $("#dgo");
  if(!append){
    dState.page = 1; more.hidden = true;
    const d = document.createElement("div"); d.className = "msg"; d.textContent = "Searching…";
    list.replaceChildren(d);
  }
  btn.disabled = true; more.disabled = true;
  try{
    const vars = { page: dState.page, type: dState.type, sort: [$("#dsort").value], statusNot: "NOT_YET_RELEASED" };
    if(dState.adult === "ONLY") vars.adult = true;
    if(dState.adult === "HIDE") vars.adult = false;
    const g = $("#dgenre").value; if(g) vars.genre = g;
    const q = $("#dq").value.trim(); if(q) vars.search = q;
    const res = await fetch("https://graphql.anilist.co", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: DQ, variables: vars })
    });
    const json = await res.json();
    if(json.errors && !json.data?.Page) throw new Error("AniList said: " + json.errors[0].message);
    const page = json.data.Page;
    if(!append) list.replaceChildren();
    const onList = new Set(state.items.map(e => e.media.id));
    page.media.forEach(m => list.append(itemCard(m, onList.has(m.id))));
    if(!list.children.length){
      const d = document.createElement("div"); d.className = "msg"; d.textContent = "No results. Try another genre or sort.";
      list.append(d);
    }
    more.hidden = !page.pageInfo.hasNextPage;
  }catch(err){
    const d = document.createElement("div"); d.className = "msg";
    d.textContent = err.message.includes("Failed to fetch") ? "Couldn't reach AniList. Check your connection and try again." : err.message;
    list.replaceChildren(d); more.hidden = true;
  }finally{ btn.disabled = false; more.disabled = false; }
}
$("#dgo").onclick = () => discover(false);
$("#dmore").onclick = () => { dState.page++; discover(true); };
$("#dq").addEventListener("keydown", e => { if(e.key === "Enter") discover(false); });

const saved = localStorage.getItem("wn_user");
if(saved){ $("#user").value = saved; loadList(saved); }
</script>
</body>
</html>
